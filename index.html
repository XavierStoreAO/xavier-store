<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0809"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Xavier Store · Plano de Vendas</title>
<style>
:root{--bg:#fdf4f7;--card:#fff;--tx:#1c1417;--mu:#7d6a72;--pk:#d6246e;--go:#9a7510;--ln:#f0d6e0;--ok:#1d7a4a;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0c0d;--card:#1b1618;--tx:#f5ecef;--mu:#aa9aa1;--pk:#f0509a;--go:#e3bf55;--ln:#35292f;--ok:#5fd49a;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f0c0d;--card:#1b1618;--tx:#f5ecef;--mu:#aa9aa1;--pk:#f0509a;--go:#e3bf55;--ln:#35292f;--ok:#5fd49a;--bad:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0b0809;border-bottom:3px solid #d4af37;padding:14px 16px;text-align:center}
.lg{font:700 26px/1 Georgia,"Times New Roman",serif;letter-spacing:2px;background:linear-gradient(90deg,#f1d27a,#d4af37 55%,#f0509a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg i{font-style:normal;font-size:15px;letter-spacing:6px;display:block;margin-top:3px;color:#f0509a;-webkit-text-fill-color:#f0509a}
header small{display:block;color:#e9dfe3;font-style:italic;margin-top:6px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap}
.tabs .on{background:var(--pk);color:#fff;border-color:var(--pk)}
.o{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.t{display:flex;justify-content:space-between;gap:8px}
.m{color:var(--mu);font-size:13px}
.b{font-size:12px;border-radius:10px;padding:2px 8px;border:1px solid var(--ln);white-space:nowrap;display:inline-block;margin-left:4px}
.b.p{color:var(--bad);border-color:var(--bad)}.b.g{color:var(--ok);border-color:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:14px}
.row .go{background:var(--pk);color:#fff;border-color:var(--pk)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pk);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;box-shadow:0 4px 14px #0005}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,500px);max-height:92vh;padding:16px}
dialog::backdrop{background:#0008}
h2{margin:0 0 2px;font-size:18px;color:var(--pk)}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 3px}
input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{margin-top:12px;padding:10px;border-radius:10px;background:var(--bg);display:flex;justify-content:space-between}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
#sv{color:var(--mu);font-size:12px;text-align:right;min-height:16px}
</style>
</head>
<body>
<header><div class="lg">XAVIER<i>STORE</i></div><small>Plano de Vendas · Moda que valoriza você</small></header>
<main>
<div class="grid">
<div class="k"><small>A receber</small><b id="k1">0 Kz</b></div>
<div class="k"><small>Em curso</small><b id="k2">0</b></div>
<div class="k"><small>Lucro líquido do mês</small><b id="k3">0 Kz</b></div>
<div class="k"><small>Dinheiro em caixa</small><b id="k4">0 Kz</b></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="row"><button id="ex" class="go">Exportar cópia</button><button id="im">Importar cópia</button></div><input type="file" id="fi" accept=".json,application/json" style="display:none">
<div id="sv" style="margin-top:8px"></div>
</main>
<button class="fab" id="add">+ Novo pedido</button>

<dialog id="dlg">
<h2 id="dt">Novo pedido</h2>
<div class="c2"><div><label>Nome do cliente</label><input id="fc" autocomplete="off"></div><div><label>Contacto</label><input id="fk" type="tel"></div></div>
<label>Tipo de cliente</label><select id="ft"><option>Cliente final</option><option>Revendedora</option></select>
<label>Produto</label><input id="fp" autocomplete="off">
<div class="c2"><div><label>Tamanho</label><input id="fs"></div><div><label>Cor</label><input id="fo"></div>
<div><label>Quantidade</label><input id="fq" type="number" inputmode="numeric" value="1"></div><div><label>Valor unitário (Kz)</label><input id="fu" type="number" inputmode="decimal"></div></div>
<div class="c2"><div><label>Custo total (Kz)</label><input id="fw" type="number" inputmode="decimal"></div><div><label>Fornecedor</label><input id="ff"></div></div>
<div class="pv"><span>Venda <b id="fv">—</b></span><span>Lucro <b id="fl">—</b></span></div>
<div class="c2"><div><label>Pagamento</label><select id="fg"><option>Pendente</option><option>Pago</option></select></div><div><label>Forma de pagamento</label><select id="fm"><option>Transferência</option><option>Multicaixa Express</option><option>Dinheiro</option><option>Outro</option></select></div>
<div><label>Entrega</label><select id="fe"><option>Levantamento</option><option>Entrega</option></select></div><div><label>Estado</label><select id="fz"><option>A preparar</option><option>Pronto</option><option>Entregue</option></select></div></div>
<label>Observações</label><textarea id="fb" rows="2"></textarea>
<div class="row"><button id="cx">Cancelar</button><button class="go" id="ok">Guardar</button></div>
<div class="row" id="delrow" style="display:none"><button id="del" class="neg">Apagar pedido</button></div>
</dialog>

<dialog id="dx">
<h2>Nova despesa</h2>
<label>Categoria</label><select id="xc"></select>
<div class="c2"><div><label>Valor (Kz)</label><input id="xv" type="number" inputmode="decimal"></div><div><label>Data</label><input id="xt" type="date"></div></div>
<label>Descrição</label><input id="xd" autocomplete="off">
<div class="row"><button id="xcx">Cancelar</button><button class="go" id="xok">Guardar</button></div>
</dialog>
<script>
var EST=["A preparar","Pronto","Entregue"];
var S={orders:[],expenses:[],tab:"Todos",editing:null};var CATS=["Mercadoria","Assistente de compras","Táxi","Transporte Luanda-Huambo","Entrega","Outra"];
var dbref=null,LS="xsm_orders2",tm=null;
function $(i){return document.getElementById(i)}
function kz(n){return Math.round(n).toLocaleString("pt-PT")+" Kz"}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function lucro(o){return o.custo!=null?o.total-o.custo:null}
function norm(o){
  if(o.total==null&&o.vc!=null){o.total=o.vc;o.custo=o.vf;o.qtd=1;o.unit=o.vc;o.pago=o.estado!=="Aguardando pagamento";o.estado=o.estado==="Entregue"?"Entregue":o.estado==="Comprado"?"Pronto":"A preparar"}
  return o}
function loadLocal(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.orders));localStorage.setItem("xsm_exp",JSON.stringify(S.expenses))}catch(e){}}
function remind(){var l=+(localStorage.getItem("xsm_last")||0);$("sv").textContent=(S.orders.length&&Date.now()-l>7*864e5)?"Faz uma cópia de segurança (botão Exportar)":"Guardado neste telemóvel"}
function save(){saveLocal();remind()}
function render(){
  var ym=new Date().toISOString().slice(0,7),rec=0,cur=0,mes=0,tot=0;
  S.orders.forEach(function(o){
    if(!o.pago)rec+=o.total||0;
    if(o.estado!=="Entregue")cur++;
    var l=lucro(o);
    if(o.estado==="Entregue"&&o.pago&&l!=null){tot+=l;if((o.data||"").slice(0,7)===ym)mes+=l}
  });
  $("k1").textContent=kz(rec);$("k2").textContent=cur;var F=fin();$("k3").textContent=kz(F.liqMes);$("k4").textContent=kz(F.caixa);
  var tabs=["Todos","Por pagar"].concat(EST).concat(["Despesas","Resumo"]);
  $("tabs").innerHTML=tabs.map(function(t){return '<button class="'+(t===S.tab?"on":"")+'" data-t="'+t+'">'+t+"</button>"}).join("");
  if(S.tab==="Resumo")return resumo();
  if(S.tab==="Despesas")return despesas();
  var list=S.orders.filter(function(o){return S.tab==="Todos"||(S.tab==="Por pagar"?!o.pago:o.estado===S.tab)}).sort(function(a,b){return(a.num||0)<(b.num||0)?1:-1});
  if(!list.length){$("view").innerHTML='<div class="empty">Ainda não há pedidos aqui.</div>';return}
  $("view").innerHTML=list.map(function(o){
    var l=lucro(o),i=EST.indexOf(o.estado),nx=EST[i+1];
    var det=[o.tamanho,o.cor,"×"+(o.qtd||1)].filter(Boolean).join(" · ");
    return '<div class="o"><div class="t"><div><b>'+esc(o.produto)+'</b> <span class="m">'+esc(det)+'</span><div class="m">Nº '+String(o.num||0).padStart(3,"0")+" · "+esc(o.cliente)+(o.tipo==="Revendedora"?" (revendedora)":"")+" · "+esc(o.data)+'</div></div><div><span class="b '+(o.pago?"g":"p")+'">'+(o.pago?"Pago":"Pendente")+'</span><span class="b">'+o.estado+"</span></div></div>"
    +'<div class="t" style="margin-top:8px"><span>Venda '+kz(o.total||0)+(o.custo!=null?" · Custo "+kz(o.custo):"")+'</span><b class="'+(l==null?"":l<0?"neg":"pos")+'">'+(l==null?"":(l>0?"+":"")+kz(l))+"</b></div>"
    +'<div class="row"><button data-e="'+o.id+'">Editar</button>'+(o.pago?"":'<button class="go" data-p="'+o.id+'">Marcar pago</button>')+(nx?'<button class="go" data-n="'+o.id+'">'+nx+"</button>":"")+"</div>"+'<div class="row"><button data-c="'+o.id+'">Enviar comprovativo</button></div></div>';
  }).join("");
}
function resumoOld(){
  function agg(k){var m={};S.orders.forEach(function(o){var l=lucro(o);if(o.estado!=="Entregue"||!o.pago||l==null)return;var n=o[k]||"Sem nome";m[n]=(m[n]||0)+l});
    var a=Object.keys(m).map(function(n){return[n,m[n]]}).sort(function(a,b){return b[1]-a[1]});
    return a.length?a.map(function(x){return '<div class="r"><span>'+esc(x[0])+'</span><b class="'+(x[1]<0?"neg":"pos")+'">'+kz(x[1])+"</b></div>"}).join(""):'<div class="empty">Sem pedidos entregues e pagos.</div>'}
  $("view").innerHTML='<div class="k" style="margin-bottom:10px"><b>Lucro por cliente</b>'+agg("cliente")+'</div><div class="k" style="margin-bottom:10px"><b>Lucro por fornecedor</b>'+agg("fornecedor")+'</div><div class="k"><b>Lucro por tipo de cliente</b>'+agg("tipo")+"</div>";
}
function prev(){
  var t=(num($("fq").value)||0)*(num($("fu").value)||0),c=num($("fw").value);
  $("fv").textContent=t?kz(t):"—";
  var l=c==null?null:t-c;$("fl").textContent=l==null?"—":kz(l);$("fl").className=l==null?"":l<0?"neg":"pos";
}
var IDS={fc:"cliente",fk:"contacto",ft:"tipo",fp:"produto",fs:"tamanho",fo:"cor",ff:"fornecedor",fm:"forma",fe:"entrega",fz:"estado",fb:"obs"};
function openForm(o){
  S.editing=o?o.id:null;$("dt").textContent=o?"Editar pedido":"Novo pedido";
  for(var k in IDS){$(k).value=o&&o[IDS[k]]!=null?o[IDS[k]]:(k==="ft"?"Cliente final":k==="fm"?"Transferência":k==="fe"?"Levantamento":k==="fz"?"A preparar":"")}
  $("fq").value=o?o.qtd:1;$("fu").value=o&&o.unit!=null?o.unit:"";$("fw").value=o&&o.custo!=null?o.custo:"";
  $("fg").value=o&&o.pago?"Pago":"Pendente";
  $("delrow").style.display=o?"flex":"none";prev();$("dlg").showModal();
}
["fq","fu","fw"].forEach(function(i){$(i).oninput=prev});
$("add").onclick=function(){openForm(null)};
$("cx").onclick=function(){$("dlg").close()};
$("ok").onclick=function(){
  var c=$("fc").value.trim(),p=$("fp").value.trim(),q=num($("fq").value)||1,u=num($("fu").value);
  if(!c||!p||u==null){alert("Preenche cliente, produto e valor unitário.");return}
  var d={qtd:q,unit:u,total:q*u,custo:num($("fw").value),pago:$("fg").value==="Pago"};
  for(var k in IDS){d[IDS[k]]=$(k).value.trim()}
  if(S.editing){S.orders.forEach(function(o){if(o.id===S.editing){Object.assign(o,d);if(o.estado==="Entregue"&&!o.dataEntrega)o.dataEntrega=new Date().toISOString().slice(0,10)}})}
  else{d.id="e"+Date.now();d.num=S.orders.reduce(function(m,o){return Math.max(m,o.num||0)},0)+1;d.data=new Date().toISOString().slice(0,10);if(d.estado==="Entregue")d.dataEntrega=d.data;S.orders.push(d)}
  $("dlg").close();save();render();
};
$("del").onclick=function(){if(confirm("Apagar este pedido?")){S.orders=S.orders.filter(function(o){return o.id!==S.editing});$("dlg").close();save();render()}};
document.body.addEventListener("click",function(e){
  var t=e.target.closest("[data-t]"),ed=e.target.closest("[data-e]"),n=e.target.closest("[data-n]"),p=e.target.closest("[data-p]");
  function get(id){return S.orders.find(function(o){return o.id===id})}
  if(t){S.tab=t.dataset.t;render()}
  if(ed)openForm(get(ed.dataset.e));
  if(p){get(p.dataset.p).pago=true;save();render()}
  if(n){var o=get(n.dataset.n);o.estado=EST[EST.indexOf(o.estado)+1];if(o.estado==="Entregue")o.dataEntrega=new Date().toISOString().slice(0,10);save();render()}
});

function fin(){
  var ym=new Date().toISOString().slice(0,7),r={rec:0,areceber:0,bruto:0,desp:0,op:0,brutoMes:0,opMes:0,meses:{}};
  S.orders.forEach(function(o){
    var l=lucro(o);
    if(o.pago)r.rec+=o.total||0;else r.areceber+=o.total||0;
    if(o.estado==="Entregue"&&o.pago&&l!=null){r.bruto+=l;var m=(o.dataEntrega||o.data||"").slice(0,7);if(m===ym)r.brutoMes+=l;(r.meses[m]=r.meses[m]||{b:0,d:0}).b+=l}
  });
  S.expenses.forEach(function(x){
    r.desp+=x.valor;
    if(x.cat!=="Mercadoria"){var m=(x.data||"").slice(0,7);r.op+=x.valor;if(m===ym)r.opMes+=x.valor;(r.meses[m]=r.meses[m]||{b:0,d:0}).d+=x.valor}
  });
  r.liq=r.bruto-r.op;r.liqMes=r.brutoMes-r.opMes;r.caixa=r.rec-r.desp;return r}
function finHtml(){
  var f=fin(),h='<div class="k" style="margin-bottom:10px"><b>Finanças</b>';
  [["Recebido",f.rec],["A receber",f.areceber],["Despesas",f.desp],["Lucro bruto",f.bruto],["Lucro líquido",f.liq],["Dinheiro em caixa",f.caixa]].forEach(function(x){h+='<div class="r"><span>'+x[0]+'</span><b class="'+(x[1]<0?"neg":"")+'">'+kz(x[1])+"</b></div>"});
  var ms=Object.keys(f.meses).sort().reverse();
  if(ms.length){h+='<div class="m" style="margin-top:10px">Lucro líquido por mês</div>';ms.forEach(function(m){var v=f.meses[m].b-f.meses[m].d;h+='<div class="r"><span>'+m+'</span><b class="'+(v<0?"neg":"pos")+'">'+kz(v)+"</b></div>"})}
  return h+'<div class="m" style="margin-top:10px">O lucro só conta pedidos entregues e pagos. Despesas de mercadoria afetam só o caixa, porque o custo já está nos pedidos.</div></div>'}
function resumo(){resumoOld();$("view").innerHTML=finHtml()+$("view").innerHTML}
function despesas(){
  var l=S.expenses.slice().sort(function(a,b){return(b.data||"")<(a.data||"")?-1:1});
  $("view").innerHTML='<div class="row" style="margin:0 0 10px"><button class="go" id="addx">+ Nova despesa</button></div>'+(l.length?l.map(function(x){return '<div class="o"><div class="t"><div><b>'+esc(x.cat)+'</b><div class="m">'+esc(x.desc)+" · "+esc(x.data)+'</div></div><b>'+kz(x.valor)+'</b></div><div class="row"><button data-xd="'+x.id+'">Apagar</button></div></div>'}).join(""):'<div class="empty">Ainda não há despesas.</div>')}
$("xc").innerHTML=CATS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("xcx").onclick=function(){$("dx").close()};
$("xok").onclick=function(){
  var v=num($("xv").value);if(v==null||v<=0){alert("Indica o valor da despesa.");return}
  S.expenses.push({id:"x"+Date.now(),cat:$("xc").value,valor:v,desc:$("xd").value.trim(),data:$("xt").value||new Date().toISOString().slice(0,10)});
  $("dx").close();save();render()};
document.body.addEventListener("click",function(e){
  if(e.target.closest("#addx")){$("xv").value="";$("xd").value="";$("xt").value=new Date().toISOString().slice(0,10);$("dx").showModal()}
  var d=e.target.closest("[data-xd]");
  if(d&&confirm("Apagar esta despesa?")){S.expenses=S.expenses.filter(function(x){return x.id!==d.dataset.xd});save();render()}
});

function dmy(d){var a=(d||"").split("-");return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:(d||"")}
function wrap(x,t,w){var ws=String(t||"").split(" "),L=[],c="";ws.forEach(function(q){var n=c?c+" "+q:q;if(x.measureText(n).width>w&&c){L.push(c);c=q}else c=n});if(c)L.push(c);return L}
function comprovativo(o){
  var W=720,H=1180,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle="#0b0809";x.fillRect(0,0,W,200);x.fillStyle="#d4af37";x.fillRect(0,200,W,6);
  x.textAlign="center";
  x.fillStyle="#e3bf55";x.font="bold 68px Georgia,serif";x.fillText("XAVIER",W/2,96);
  x.fillStyle="#f0509a";x.font="bold 30px Georgia,serif";x.fillText("S T O R E",W/2,144);
  x.fillStyle="#eeeeee";x.font="italic 22px Georgia,serif";x.fillText("Moda que valoriza você",W/2,182);
  x.fillStyle="#1c1417";x.font="bold 32px sans-serif";x.fillText("COMPROVATIVO DE VENDA",W/2,262);
  x.fillStyle="#666666";x.font="22px sans-serif";x.fillText("Nº "+String(o.num||0).padStart(3,"0")+"  ·  "+dmy(o.data),W/2,300);
  var y=360;x.textAlign="left";
  function ln(a,b){x.fillStyle="#888888";x.font="20px sans-serif";x.fillText(a,50,y);x.fillStyle="#1c1417";x.font="bold 24px sans-serif";var L=wrap(x,b,470);L.forEach(function(t,i){x.fillText(t,200,y+i*30)});y+=Math.max(1,L.length)*30+14}
  ln("Cliente",o.cliente||"");if(o.contacto)ln("Contacto",o.contacto);
  y+=6;x.fillStyle="#d4af37";x.fillRect(50,y,W-100,3);y+=44;
  x.fillStyle="#888888";x.font="20px sans-serif";x.fillText("Produto",50,y);x.textAlign="center";x.fillText("Qtd",470,y);x.textAlign="right";x.fillText("Valor",W-50,y);x.textAlign="left";y+=40;
  var nome=o.produto||"";var det=[o.tamanho&&"Tam. "+o.tamanho,o.cor].filter(Boolean).join(" · ");
  x.fillStyle="#1c1417";x.font="bold 26px sans-serif";var L=wrap(x,nome,360);L.forEach(function(t,i){x.fillText(t,50,y+i*32)});
  x.textAlign="center";x.fillText(String(o.qtd||1),470,y);x.textAlign="right";x.fillText(kz(o.total||0),W-50,y);x.textAlign="left";y+=L.length*32;
  if(det){x.fillStyle="#666666";x.font="22px sans-serif";x.fillText(det,50,y);y+=30}
  if((o.qtd||1)>1&&o.unit!=null){x.fillStyle="#666666";x.font="22px sans-serif";x.fillText("Preço unitário: "+kz(o.unit),50,y);y+=30}
  y+=20;x.fillStyle="#d4af37";x.fillRect(50,y,W-100,3);y+=62;
