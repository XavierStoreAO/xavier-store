<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0809"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Xavier Store · Plano de Vendas</title>
<style>
:root{--bg:#fdf4f7;--card:#fff;--tx:#1c1417;--mu:#7d6a72;--pk:#d6246e;--go:#9a7510;--ln:#f0d6e0;--ok:#1d7a4a;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0c0d;--card:#1b1618;--tx:#f5ecef;--mu:#aa9aa1;--pk:#f0509a;--go:#e3bf55;--ln:#35292f;--ok:#5fd49a;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f0c0d;--card:#1b1618;--tx:#f5ecef;--mu:#aa9aa1;--pk:#f0509a;--go:#e3bf55;--ln:#35292f;--ok:#5fd49a;--bad:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0b0809;border-bottom:3px solid #d4af37;padding:14px 16px;text-align:center}
.lg{font:700 26px/1 Georgia,"Times New Roman",serif;letter-spacing:2px;background:linear-gradient(90deg,#f1d27a,#d4af37 55%,#f0509a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg i{font-style:normal;font-size:15px;letter-spacing:6px;display:block;margin-top:3px;color:#f0509a;-webkit-text-fill-color:#f0509a}
header small{display:block;color:#e9dfe3;font-style:italic;margin-top:6px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap}
.tabs .on{background:var(--pk);color:#fff;border-color:var(--pk)}
.o{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.t{display:flex;justify-content:space-between;gap:8px}
.m{color:var(--mu);font-size:13px}
.b{font-size:12px;border-radius:10px;padding:2px 8px;border:1px solid var(--ln);white-space:nowrap;display:inline-block;margin-left:4px}
.b.p{color:var(--bad);border-color:var(--bad)}.b.g{color:var(--ok);border-color:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:14px}
.row .go{background:var(--pk);color:#fff;border-color:var(--pk)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pk);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;box-shadow:0 4px 14px #0005}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,520px);max-height:92vh;padding:16px;overflow-y:auto}
dialog::backdrop{background:#0008}
h2{margin:0 0 2px;font-size:18px;color:var(--pk)}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 3px}
input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{margin-top:12px;padding:10px;border-radius:10px;background:var(--bg);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
#sv{color:var(--mu);font-size:12px;text-align:right;min-height:16px}
.item{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg);position:relative}
.item .rm{position:absolute;top:6px;right:6px;background:transparent;border:0;color:var(--bad);font-size:18px;padding:4px 8px;cursor:pointer;line-height:1}
.item-head{font-size:12px;color:var(--mu);margin-bottom:4px}
#addItem{background:var(--pk);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:13px}
.buy-group{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.buy-group h3{margin:0 0 8px;font-size:15px;color:var(--pk);display:flex;justify-content:space-between;align-items:center}
.buy-item{padding:8px 0;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.buy-item:last-child{border-bottom:0}
.buy-item .info{flex:1}
.buy-item button{padding:6px 10px;border-radius:8px;border:1px solid var(--ok);background:transparent;color:var(--ok);font-size:13px;white-space:nowrap}
.btn-all{background:var(--ok)!important;color:#fff!important;border:0!important;padding:5px 10px!important;border-radius:8px!important;font-size:12px!important}
.search-box{margin-bottom:12px}
.search-box input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px}
.client-link{color:var(--pk);text-decoration:underline;cursor:pointer}
.wa-btn{background:#25D366!important;color:#fff!important;border-color:#25D366!important}
.hist-header{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.bar{height:8px;border-radius:6px;background:var(--pk);margin-top:4px}
.mic{padding:2px 8px;font-size:12px;margin-left:6px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.mic.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.mini{display:flex;gap:6px;margin-top:6px}
.mini button{flex:1;padding:6px;font-size:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
</style>
</head>
<body>
<header><div class="lg">XAVIER<i>STORE</i></div><small>Plano de Vendas · Moda que valoriza você</small></header>
<main>
<div class="grid">
<div class="k"><small>A receber</small><b id="k1">0 Kz</b></div>
<div class="k"><small>Em curso</small><b id="k2">0</b></div>
<div class="k"><small>Lucro líquido do mês</small><b id="k3">0 Kz</b></div>
<div class="k"><small>Dinheiro em caixa</small><b id="k4">0 Kz</b></div>
</div>
<div class="search-box"><input id="search" type="search" placeholder="Pesquisar cliente, nº pedido ou produto..." autocomplete="off"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="row"><button id="ex" class="go">Exportar cópia</button><button id="im">Importar cópia</button></div><div class="row"><button id="jn">Juntar pedidos de outra cópia</button><button id="sr">Série</button></div><input type="file" id="fi" accept=".json,application/json" style="display:none"><input type="file" id="fj" accept=".json,application/json" style="display:none">
<div id="sv" style="margin-top:8px"></div>
</main>
<button class="fab" id="add">+ Novo pedido</button>

<dialog id="dlg">
<h2 id="dt">Novo pedido</h2>
<div class="c2"><div><label>Nome do cliente <button type="button" class="mic" data-mic="fc">🎤 Ditar</button></label><input id="fc" list="dlc" autocomplete="off"></div><div><label>Contacto</label><input id="fk" type="tel"><div class="mini"><button type="button" id="wa">WhatsApp</button><button type="button" id="pk">Contactos</button></div></div></div>
<label>Tipo de cliente</label><select id="ft"><option>Cliente final</option><option>Revendedora</option></select>
<div id="hint" class="m" style="margin-top:6px"></div><datalist id="dlc"></datalist><datalist id="dlp"></datalist>

<div style="margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center">
  <b style="color:var(--pk);font-size:15px">Produtos</b>
  <button type="button" id="addItem">+ Adicionar produto</button>
</div>
<div id="items"></div>

<div class="pv">
  <span>Venda <b id="fv">—</b></span>
  <span>Custo <b id="fcusto">—</b></span>
  <span>Lucro <b id="fl">—</b></span>
</div>

<div class="c2">
  <div><label>Pagamento</label><select id="fg"><option>Pendente</option><option>Pago</option></select></div>
  <div><label>Forma de pagamento</label><select id="fm"><option>Transferência</option><option>Multicaixa Express</option><option>Dinheiro</option><option>Outro</option></select></div>
  <div><label>Entrega</label><select id="fe"><option>Levantamento</option><option>Entrega</option></select></div>
  <div><label>Estado</label><select id="fz"><option>A preparar</option><option>Pronto</option><option>Entregue</option></select></div>
</div>
<label>Observações <button type="button" class="mic" data-mic="fb">🎤 Ditar</button></label><textarea id="fb" rows="2"></textarea>
<div class="row"><button id="cx">Cancelar</button><button class="go" id="ok">Guardar</button></div>
<div class="row" id="delrow" style="display:none"><button id="del" class="neg">Apagar pedido</button></div>
</dialog>

<dialog id="dx">
<h2>Nova despesa</h2>
<label>Categoria</label><select id="xc"></select>
<div class="c2"><div><label>Valor (Kz)</label><input id="xv" type="number" inputmode="decimal"></div><div><label>Data</label><input id="xt" type="date"></div></div>
<label>Descrição</label><input id="xd" autocomplete="off">
<div class="row"><button id="xcx">Cancelar</button><button class="go" id="xok">Guardar</button></div>
</dialog>
<script>
var EST=["A preparar","Pronto","Entregue"];
var S={orders:[],expenses:[],tab:"Todos",editing:null,filterClient:null,q:""};
var CATS=["Mercadoria","Assistente de compras","Táxi","Transporte Luanda-Huambo","Entrega","Outra"];
var LS="xsm_orders2";
function $(i){return document.getElementById(i)}
function kz(n){return Math.round(n).toLocaleString("pt-PT")+" Kz"}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/"/g,"&quot;")}
function lucro(o){return o.custo!=null?o.total-o.custo:null}

function cleanPhone(tel){
  if(!tel)return "";
  var n=String(tel).replace(/\D/g,"");
  if(n.startsWith("244"))return n;
  if(n.length===9)return "244"+n;
  return n;
}

function getItems(o){
  if(o.items&&o.items.length)return o.items;
  return [{
    produto:o.produto||"",
    tamanho:o.tamanho||"",
    cor:o.cor||"",
    qtd:o.qtd||1,
    unit:o.unit,
    custo:o.custo,
    fornecedor:o.fornecedor||"",
    comprado:false
  }];
}

function norm(o){
  if(o.total==null&&o.vc!=null){o.total=o.vc;o.custo=o.vf;o.qtd=1;o.unit=o.vc;o.pago=o.estado!=="Aguardando pagamento";o.estado=o.estado==="Entregue"?"Entregue":o.estado==="Comprado"?"Pronto":"A preparar"}
  if(!o.items){
    o.items=[{
      produto:o.produto||"",
      tamanho:o.tamanho||"",
      cor:o.cor||"",
      qtd:o.qtd||1,
      unit:o.unit,
      custo:o.custo,
      fornecedor:o.fornecedor||"",
      comprado:false
    }];
  }
  o.items.forEach(function(it){if(it.comprado==null)it.comprado=false});
  var tot=0,cus=0;
  o.items.forEach(function(it){
    var q=it.qtd||1,u=it.unit||0;
    tot+=q*u;
    if(it.custo!=null)cus+=it.custo;
  });
  o.total=tot;
  if(o.items.some(function(it){return it.custo!=null}))o.custo=cus;else o.custo=null;
  if(o.items[0]){
    o.produto=o.items[0].produto;
    o.tamanho=o.items[0].tamanho;
    o.cor=o.items[0].cor;
    o.qtd=o.items[0].qtd;
    o.unit=o.items[0].unit;
    o.fornecedor=o.items[0].fornecedor;
  }
  return o;
}

function loadLocal(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.orders));localStorage.setItem("xsm_exp",JSON.stringify(S.expenses));localStorage.setItem("xsm_drafts",JSON.stringify(S.drafts))}catch(e){}}
function remind(){var l=+(localStorage.getItem("xsm_last")||0);$("sv").textContent=(S.orders.length&&Date.now()-l>7*864e5)?"Faz uma cópia de segurança (botão Exportar)":"Guardado neste telemóvel"}
function save(){saveLocal();remind()}

function countPorComprar(){
  var n=0;
  S.orders.forEach(function(o){
    if(o.estado==="Entregue")return;
    getItems(o).forEach(function(it){if(!it.comprado)n++});
  });
  return n;
}

function matchSearch(o,q){
  if(!q)return true;
  q=q.toLowerCase();
  if(String(o.num||"").includes(q))return true;
  if((o.cliente||"").toLowerCase().includes(q))return true;
  if((o.contacto||"").includes(q))return true;
  return getItems(o).some(function(it){
    return (it.produto||"").toLowerCase().includes(q) ||
           (it.fornecedor||"").toLowerCase().includes(q) ||
           (it.cor||"").toLowerCase().includes(q);
  });
}

function render(){
  var ym=new Date().toISOString().slice(0,7),rec=0,cur=0;
  S.orders.forEach(function(o){
    if(!o.pago)rec+=o.total||0;
    if(o.estado!=="Entregue")cur++;
  });
  $("k1").textContent=kz(rec);$("k2").textContent=cur;var F=fin();$("k3").textContent=kz(F.liqMes);$("k4").textContent=kz(F.caixa);
  var porComprar=countPorComprar();var nAv=avisos(stats()).length;
  var tabs=["Todos","Lista rápida","Por pagar"].concat(EST).concat(["A comprar","Despesas","Mais pedidos","Resumo"]);
  $("tabs").innerHTML=tabs.map(function(t){
    var label=t;
    if(t==="A comprar"&&porComprar>0)label=t+" ("+porComprar+")";
    if(t==="Mais pedidos"&&nAv>0)label=t+" ("+nAv+")";
    if(t==="Lista rápida"&&S.drafts.length)label=t+" ("+S.drafts.length+")";
    return '<button class="'+(t===S.tab?"on":"")+'" data-t="'+t+'">'+label+"</button>";
  }).join("");

  if(S.tab==="Resumo")return resumo();
  if(S.tab==="Despesas")return despesas();
  if(S.tab==="A comprar")return renderCompras();
  if(S.tab==="Mais pedidos")return maisPedidos();
  if(S.tab==="Lista rápida")return rascunhos();

  var list=S.orders.filter(function(o){
    if(S.filterClient && o.cliente!==S.filterClient)return false;
    if(S.tab==="Todos")return matchSearch(o,S.q);
    if(S.tab==="Por pagar")return !o.pago && matchSearch(o,S.q);
    return o.estado===S.tab && matchSearch(o,S.q);
  }).sort(function(a,b){return(a.num||0)<(b.num||0)?1:-1});

  var header="";
  if(S.filterClient){
    header='<div class="hist-header"><b>Histórico de '+esc(S.filterClient)+'</b> · '+list.length+' pedido(s)'+
      '<div class="row" style="margin-top:8px"><button id="clearFilter">← Voltar a todos</button></div></div>';
  }

  if(!list.length){
    $("view").innerHTML=header+'<div class="empty">'+(S.q||S.filterClient?"Nenhum resultado encontrado.":"Ainda não há pedidos aqui.")+'</div>';
    return;
  }

  $("view").innerHTML=header+list.map(function(o){
    var l=lucro(o),i=EST.indexOf(o.estado),nx=EST[i+1];
    var items=getItems(o);
    var porComprarItens=items.filter(function(it){return !it.comprado}).length;
    var prodLabel="";
    if(items.length===1){
      var it=items[0];
      var det=[it.tamanho,it.cor,"×"+(it.qtd||1)].filter(Boolean).join(" · ");
      prodLabel='<b>'+esc(it.produto)+'</b> <span class="m">'+esc(det)+'</span>';
    }else{
      prodLabel='<b>'+items.length+' produtos</b> <span class="m">'+esc(items.map(function(it){return it.produto}).join(", "))+'</span>';
    }
    var buyBadge=porComprarItens>0?'<span class="b p">'+porComprarItens+' por comprar</span>':"";
    var wa="";
    if(o.contacto){
      var phone=cleanPhone(o.contacto);
      if(phone)wa='<button class="wa-btn" data-wa="'+phone+'">WhatsApp</button>';
    }
    return '<div class="o"><div class="t"><div>'+prodLabel+
      '<div class="m">Nº '+String(o.num||0).padStart(3,"0")+' · <span class="client-link" data-client="'+esc(o.cliente)+'">'+esc(o.cliente)+'</span>'+
      (o.tipo==="Revendedora"?" (revendedora)":"")+" · "+esc(o.data)+'</div></div>'+
      '<div><span class="b '+(o.pago?"g":"p")+'">'+(o.pago?"Pago":"Pendente")+'</span><span class="b">'+o.estado+"</span>"+buyBadge+"</div></div>"+
      '<div class="t" style="margin-top:8px"><span>Venda '+kz(o.total||0)+(o.custo!=null?" · Custo "+kz(o.custo):"")+'</span><b class="'+(l==null?"":l<0?"neg":"pos")+'">'+(l==null?"":(l>0?"+":"")+kz(l))+"</b></div>"+
      '<div class="row"><button data-e="'+o.id+'">Editar</button>'+(o.pago?"":'<button class="go" data-p="'+o.id+'">Marcar pago</button>')+(nx?'<button class="go" data-n="'+o.id+'">'+nx+"</button>":"")+wa+"</div>"+
      '<div class="row"><button data-c="'+o.id+'">Enviar comprovativo</button></div></div>';
  }).join("");
}

function renderCompras(){
  var groups={};
  var totalItens=0, totalCusto=0;
  S.orders.forEach(function(o){
    if(o.estado==="Entregue")return;
    getItems(o).forEach(function(it, idx){
      if(it.comprado)return;
      totalItens++;
      if(it.custo!=null)totalCusto+=it.custo;
      var forn=it.fornecedor||"Sem fornecedor";
      if(!groups[forn])groups[forn]=[];
      groups[forn].push({
        orderId:o.id,
        itemIdx:idx,
        num:o.num,
        cliente:o.cliente,
        produto:it.produto,
        tamanho:it.tamanho,
        cor:it.cor,
        qtd:it.qtd||1,
        unit:it.unit,
        custo:it.custo,
        pago:o.pago
      });
    });
  });

  var keys=Object.keys(groups).sort();
  if(!keys.length){
    $("view").innerHTML='<div class="empty">Nada por comprar de momento. 🎉<br><span class="m">Todos os produtos dos pedidos em curso já foram marcados como comprados.</span></div>';
    return;
  }

  var html='<div class="k" style="margin-bottom:12px"><small>Itens por comprar</small><b>'+totalItens+'</b>'+(totalCusto?' · Custo estimado '+kz(totalCusto):'')+'</div>';

  keys.forEach(function(forn){
    html+='<div class="buy-group"><h3><span>'+esc(forn)+'</span><button class="btn-all" data-buyall="'+esc(forn)+'">Marcar todos</button></h3>';
    groups[forn].forEach(function(g){
      var det=[g.tamanho,g.cor,"×"+g.qtd].filter(Boolean).join(" · ");
      html+='<div class="buy-item">'+
        '<div class="info">'+
          '<b>'+esc(g.produto)+'</b> <span class="m">'+esc(det)+'</span>'+
          '<div class="m">Pedido Nº '+String(g.num||0).padStart(3,"0")+' · '+esc(g.cliente)+(g.pago?' · <span class="pos">Pago</span>':' · <span class="neg">Pendente</span>')+'</div>'+
          (g.custo!=null?'<div class="m">Custo: '+kz(g.custo)+'</div>':'')+
        '</div>'+
        '<button data-buy="'+g.orderId+':'+g.itemIdx+'">Já comprei</button>'+
      '</div>';
    });
    html+='</div>';
  });

  $("view").innerHTML=html;
}

function resumoOld(){
  function agg(k){var m={};S.orders.forEach(function(o){var l=lucro(o);if(o.estado!=="Entregue"||!o.pago||l==null)return;var n=o[k]||"Sem nome";m[n]=(m[n]||0)+l});
    var a=Object.keys(m).map(function(n){return[n,m[n]]}).sort(function(a,b){return b[1]-a[1]});
    return a.length?a.map(function(x){return '<div class="r"><span>'+esc(x[0])+'</span><b class="'+(x[1]<0?"neg":"pos")+'">'+kz(x[1])+"</b></div>"}).join(""):'<div class="empty">Sem pedidos entregues e pagos.</div>'}
  $("view").innerHTML='<div class="k" style="margin-bottom:10px"><b>Lucro por cliente</b>'+agg("cliente")+'</div><div class="k" style="margin-bottom:10px"><b>Lucro por tipo de cliente</b>'+agg("tipo")+"</div>";
}

function calc(){
  var lines=$("items").querySelectorAll(".item");
  var tot=0,cus=0,hasCusto=false;
  lines.forEach(function(line){
    var q=num(line.querySelector(".iq").value)||0;
    var u=num(line.querySelector(".iu").value)||0;
    var c=num(line.querySelector(".ic").value);
    tot+=q*u;
    if(c!=null){cus+=c;hasCusto=true}
  });
  $("fv").textContent=tot?kz(tot):"—";

  h+='<div class="k" style="margin-bottom:10px"><b>Produtos mais pedidos</b>'+(pl.length?pl.map(function(p){var t=topN(p.tam,2).map(function(x){return esc(x[0])+" ("+x[1]+")"}).join(", ");return '<div class="r"><div>'+esc(p.name)+'<div class="m">'+p.ped+" pedido(s)"+(t?" · tamanhos: "+t:"")+'</div></div><b>'+p.qtd+" un.</b></div>"}).join(""):'<div class="empty">Sem dados.</div>')+"</div>";
  var tl=topN(st.T,12),mx=tl.length?tl[0][1]:1;
  h+='<div class="k" style="margin-bottom:10px"><b>Tamanhos mais pedidos</b>'+(tl.length?tl.map(function(x){return '<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+esc(x[0])+'</span><b>'+x[1]+' un.</b></div><div class="bar" style="width:'+Math.round(x[1]*100/mx)+'%"></div></div>'}).join(""):'<div class="empty">Ainda sem tamanhos registados.</div>')+"</div>";
  var cl=Object.keys(st.C).map(function(k){return st.C[k]}).sort(function(a,b){return b.ped-a.ped||b.gasto-a.gasto}).slice(0,10);
  h+='<div class="k"><b>Clientes e os seus tamanhos</b>'+(cl.length?cl.map(function(c){var t=topN(c.tam,2).map(function(x){return esc(x[0])+" ("+x[1]+")"}).join(", "),pk=topN(c.prod,1);return '<div class="r"><div>'+esc(c.name)+'<div class="m">'+c.ped+" pedido(s)"+(t?" · tamanhos: "+t:"")+(pk.length&&st.P[pk[0][0]]?" · mais pedido: "+esc(st.P[pk[0][0]].name):"")+'</div></div><b>'+kz(c.gasto)+"</b></div>"}).join(""):'<div class="empty">Sem clientes.</div>')+"</div>";
  $("view").innerHTML=h}
function refreshLists(){
  var C={},P={};S.orders.forEach(function(o){if(o.cliente)C[o.cliente]=1;getItems(o).forEach(function(it){if(it.produto)P[it.produto]=1})});
  $("dlc").innerHTML=Object.keys(C).map(function(n){return '<option value="'+esc(n)+'">'}).join("");
  $("dlp").innerHTML=Object.keys(P).map(function(n){return '<option value="'+esc(n)+'">'}).join("")}
function hint(){
  var h=$("hint");h.textContent="";var n=nk($("fc").value);if(!n)return;
  var c=stats().C[n];if(!c)return;
  var t=topN(c.tam,2);
  h.textContent="Cliente habitual: "+c.ped+" pedido(s)"+(t.length?". Tamanhos: "+t.map(function(x){return x[0]+" ("+x[1]+")"}).join(", "):"")+".";
  if(!$("fk").value&&c.contacto)$("fk").value=c.contacto;
  if(S.editing==null&&c.tipo)$("ft").value=c.tipo}
function sugSize(line){
  var ip=line.querySelector(".ip"),is=line.querySelector(".is");if(!ip||!is)return;
  var pk=nk(ip.value),st=stats(),m=st.CP[nk($("fc").value)+"|"+pk]||(st.P[pk]&&st.P[pk].tam)||{},t=topN(m,1);
  is.placeholder=(t.length&&pk)?"habitual: "+t[0][0]:""}
function openForm(o){openForm0(o);refreshLists();hint();document.querySelectorAll("#items .item").forEach(sugSize)}
$("fc").addEventListener("input",hint);
$("fc").addEventListener("change",function(){hint();document.querySelectorAll("#items .item").forEach(sugSize)});
$("items").addEventListener("change",function(e){var l=e.target.closest(".item");if(l&&e.target.classList.contains("ip"))sugSize(l)});

S.drafts=[];
var REC=null,RECBTN=null;
function ditar(el,btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Este navegador não tem ditado. Usa o microfone do teclado do telemóvel.");return}
  if(REC){REC.stop();return}
  if(!navigator.onLine){alert("Sem internet. O ditado precisa de internet. Usa o microfone do teclado do telemóvel.");return}
  var r=new SR();r.lang="pt-PT";r.interimResults=false;r.continuous=false;
  r.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t+=e.results[i][0].transcript+" "}
    if(t.trim()){el.value=(el.value?el.value.replace(/\s*$/," "):"")+t.trim();el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}};
  r.onerror=function(e){if(e.error==="not-allowed"||e.error==="service-not-allowed")alert("O microfone está bloqueado. Autoriza o microfone para este site nas definições do Chrome.")};
  r.onend=function(){REC=null;if(RECBTN){RECBTN.classList.remove("on");RECBTN.textContent=RECBTN.dataset.t}RECBTN=null};
  REC=r;RECBTN=btn;btn.dataset.t=btn.textContent;btn.textContent="● A ouvir";btn.classList.add("on");
  try{r.start()}catch(e){REC=null;RECBTN=null;btn.classList.remove("on");btn.textContent=btn.dataset.t}}
function rascunhos(){
  var l=S.drafts.slice().sort(function(a,b){return(b.at||0)-(a.at||0)});
  $("view").innerHTML='<div class="k" style="margin-bottom:10px"><b>Lista rápida</b><div class="m">Fala ou escreve os pedidos à medida que chegam. Depois organizas e crias o pedido completo.</div><div class="mini"><button type="button" class="mic" data-mic="dtx" style="flex:0 0 auto;padding:6px 12px">🎤 Ditar</button></div><textarea id="dtx" rows="3" placeholder="Ex: Maria quer 2 vestidos tamanho M, pretos" style="margin-top:8px"></textarea><div class="row"><button class="go" id="dsv">Guardar na lista</button></div></div>'
  +(l.length?'<div class="row" style="margin:0 0 10px"><button id="dsh">Partilhar lista</button></div>'+l.map(function(q){return '<div class="o"><div>'+esc(q.text)+'</div><div class="m">'+esc(dmy(q.d||""))+'</div><div class="row"><button data-dc="'+q.id+'">Criar pedido</button><button data-dd="'+q.id+'">Feito</button></div></div>'}).join(""):'<div class="empty">A lista está vazia.</div>')}
$("wa").onclick=function(){var n=cleanPhone($("fk").value);if(!n){alert("Escreve primeiro o contacto.");return}window.open("https://wa.me/"+n,"_blank")};
$("pk").onclick=function(){
  if(!(navigator.contacts&&navigator.contacts.select)){alert("O teu navegador não deixa abrir a lista de contactos. Escreve o número à mão.");return}
  navigator.contacts.select(["name","tel"],{multiple:false}).then(function(r){
    if(!r||!r.length)return;var c=r[0];
    if(c.tel&&c.tel[0])$("fk").value=c.tel[0];
    if(c.name&&c.name[0]&&!$("fc").value.trim())$("fc").value=c.name[0];
    hint()}).catch(function(){})};
document.body.addEventListener("click",function(e){
  var m=e.target.closest("[data-mic]");if(m){ditar($(m.dataset.mic),m);return}
  if(e.target.closest("#dsv")){
    var t=$("dtx").value.trim();if(!t){alert("Escreve ou dita o pedido primeiro.");return}
    if(REC)REC.stop();
    S.drafts.push({id:"d"+Date.now(),text:t,d:new Date().toISOString().slice(0,10),at:Date.now()});save();render();return}
  if(e.target.closest("#dsh")){
    var tx=S.drafts.map(function(q,i){return(i+1)+". "+q.text}).join("\n");
    if(navigator.share){navigator.share({title:"Lista de pedidos",text:tx}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(tx).then(function(){alert("Lista copiada.")})}
    return}
  var c=e.target.closest("[data-dc]");
  if(c){var q=S.drafts.find(function(x){return x.id===c.dataset.dc});if(q){S.tab="Todos";render();openForm(null);$("fb").value="Da lista rápida: "+q.text}return}
  var d=e.target.closest("[data-dd]");
  if(d&&confirm("Marcar como feito? Sai da lista.")){S.drafts=S.drafts.filter(function(x){return x.id!==d.dataset.dd});save();render()}
});
$("ex").onclick=function(){var b=new Blob([JSON.stringify({v:3,orders:S.orders,expenses:S.expenses,drafts:S.drafts})],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="xavier-store-copia-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem("xsm_last",Date.now())}catch(e){}remind()};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.orders))throw 0;if(confirm("Isto substitui os "+S.orders.length+" pedidos atuais por "+d.orders.length+". Continuar?")){S.orders=d.orders.map(norm);if(Array.isArray(d.expenses))S.expenses=d.expenses;if(Array.isArray(d.drafts))S.drafts=d.drafts;save();render()}}catch(e){alert("Ficheiro inválido.")}};r.readAsText(f);this.value=""};
try{S.expenses=JSON.parse(localStorage.getItem("xsm_exp")||"[]")}catch(e){S.expenses=[]}
try{S.drafts=JSON.parse(localStorage.getItem("xsm_drafts")||"[]")}catch(e){S.drafts=[]}
S.orders=(loadLocal()||[]).map(norm);render();remind();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
